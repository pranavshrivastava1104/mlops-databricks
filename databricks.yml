bundle:
  name: bank-marketing-mlops

include:
  - resources/*

artifacts:
  default:
    type: whl
    build: uv build
    path: .

variables:
  git_sha:
    default: "none"

  branch:
    default: "local"

  schedule_pause_status:
    default: "PAUSED"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a44dcc07-4f2a.cloud.databricks.com

  acc:
    workspace: 
      host: https://dbc-a44dcc07-4f2a.cloud.databricks.com
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
    variables:
      schedule_pause_status: PAUSED

  prd: 
    workspace: 
      host: https://dbc-a44dcc07-4f2a.cloud.databricks.com
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.na
    variables:
      schedule_pause_status: PAUSED
    